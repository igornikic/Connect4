<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect4 - Register</title>
  <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../Styles/resMessage.css">
  <script src="../config.js"></script>
</head>
<body>
  <main>
    <h1>Connect4</h1>
    <div class="form-container">
      <form method="POST" id="registerForm">
        <!-- Username -->
        <div>
          <label for="username">Username:</label>
        </div>
        <input 
          type="text" 
          name="username" 
          id="username" 
          placeholder="Enter your username" 
          autocomplete="username" 
          required 
          aria-required="true"
          tabindex="1"
        >

        <!-- Password -->
        <div>
          <label for="password">Password:</label>
        </div>
        <div id="password_field">
          <input 
            type="password" 
            name="password" 
            id="password" 
            placeholder="Enter your password" 
            required 
            aria-required="true"
            tabindex="2"
          >
          <div id="toggle_password">
            <input id="check1" class="check" type="checkbox" tabindex="-1">
            <label for="check1" id="toggle">SHOW</label>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="confirm_password">Confirm Password:</label>
        </div>
        <div id="password_field">
          <input 
            type="password" 
            name="confirm_password" 
            id="confirm_password" 
            placeholder="Enter your password" 
            required 
            aria-required="true"
            tabindex="3"
          >
          <div id="toggle_password">
            <input id="check2" class="check" type="checkbox" tabindex="-1">
            <label for="check2" id="toggle2">SHOW</label>
          </div>
        </div>

        <!-- Register button -->
        <button type="submit" tabindex="4">Register</button>
        
        <!-- Link to login -->
        <p>
          Already have an account? 
          <a href="/">Login here</a>.
        </p>
      </form>
    </div>
  </main>

  <div id="responseMessage" class="response"></div>
  <script src="../index.js"></script>
</body>
</html>
